<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Finder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">♪ AUDIO FINDER<small>SOUND QUEST FOR GAME DEV</small></div>
  <nav>
    <button data-screen="search" class="active">探す</button>
    <button data-screen="history">履歴</button>
    <button data-screen="settings">設定</button>
  </nav>
</header>

<main>
  <!-- 8.2 「探す」画面 -->
  <section id="screen-search" class="screen active">
    <div class="win">
      <div class="win-title">どんな場面の音を探す？</div>
      <form class="quest" id="quest">
        <textarea name="query" placeholder="例：ボス戦、緊迫感あり、オーケストラ系、ループ前提"></textarea>
        <button class="btn primary" type="submit">探す</button>
      </form>
    </div>
    <div id="search-body"></div>
  </section>

  <!-- 8.3 「履歴」画面 -->
  <section id="screen-history" class="screen">
    <div class="history">
      <div class="win">
        <div class="win-title">冒険の記録 <span class="sub">直近50件</span></div>
        <ul class="hist-list" id="hist-list"></ul>
      </div>
      <div id="hist-detail"></div>
    </div>
  </section>

  <!-- 8.4 「設定」画面 -->
  <section id="screen-settings" class="screen">
    <div class="win">
      <div class="win-title">目録 <span class="sub">ローカル素材のスキャン</span></div>
      <div class="stats">
        <div class="stat"><div class="k">登録フォルダ</div><div class="v num" id="stat-roots">—</div></div>
        <div class="stat"><div class="k">目録のファイル数</div><div class="v num" id="stat-files">—</div></div>
        <div class="stat"><div class="k">最後のスキャン</div><div class="v num" id="stat-scanned" style="font-size:16px">—</div></div>
      </div>
      <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        <div style="flex:1; min-width:220px;">
          <div class="bar"><div id="scan-bar" style="width:0%"></div></div>
          <div class="hint" id="scan-text">まだスキャンしていません</div>
        </div>
        <button class="btn primary" type="button" id="rescan">再スキャン</button>
      </div>
      <div id="scan-msg"></div>
    </div>
    <div class="win">
      <div class="win-title">検索対象フォルダ</div>
      <table class="roots">
        <thead><tr><th>有効</th><th>名前 / パス</th><th>状態</th><th>ファイル数</th><th></th></tr></thead>
        <tbody id="roots"></tbody>
      </table>
      <div id="roots-msg"></div>
    </div>
    <div class="win">
      <div class="win-title">フォルダを追加</div>
      <form class="form-row" id="add-root">
        <input class="path-in" name="path" placeholder="フォルダの絶対パス（例：D:\GameAssets\Audio\SciFiPack）">
        <input class="label-in" name="label" placeholder="表示名（例：SciFi Pack）">
        <button class="btn" type="submit">追加</button>
      </form>
      <div class="hint">※ ブラウザのフォルダ選択では絶対パスが取れないため、パスは文字で入力します。追加後は「再スキャン」で目録に反映されます。</div>
      <div id="add-root-msg"></div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
